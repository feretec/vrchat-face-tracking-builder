name: Validate and release VPM package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate package and repository index
        run: python3 tools/build_vpm.py --check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check version tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('Packages/com.feretec.vrchat-face-tracking-builder/package.json').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + manifest['version'], 'Tag and package version differ'
          PY
          python3 tools/build_vpm.py --check
      - name: Publish package ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/vpm/*.zip \
            --verify-tag --title "VRChat Face Tracking Builder $RELEASE_TAG" \
            --notes "VCC / ALCOMからの導入手順はREADMEをご確認ください。"
